global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "invoice-api"

    metrics_path: "/api/v1/metrics"

    # The metrics endpoint is protected with HTTP Basic Auth (METRICS_USER / METRICS_PASSWORD
    # from the API's .env). Put the same values here. Do not commit real credentials:
    # use `password_file` with a mounted secret in production.
    basic_auth:
      username: "CHANGE_ME_METRICS_USER"
      password: "CHANGE_ME_METRICS_PASSWORD"

    static_configs:
      # "api" is the service name in docker-compose.yml (same network as Prometheus)
      - targets: ["api:8000"]
