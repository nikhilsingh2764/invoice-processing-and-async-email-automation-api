name: Backend CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:latest
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: ./Backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter / Prettier Check
        run: npx prettier --check "src/**/*.js"

      - name: Run Tests
        run: npm test
        env:
          PORT: 5000
          MONGODB_URI: mongodb://localhost:27017/test-db
          REDIS_URL: redis://localhost:6379
          CLIENT_URL: http://localhost:5173
          BREVO_API_KEY: test_brevo_key
          EMAIL_USER: test@example.com
          CACHE_ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
          ACCESS_TOKEN_SECRET: test_access_secret_key_12345
          REFRESH_TOKEN_SECRET: test_refresh_secret_key_12345

  docker-build-check:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and validate API Image
      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: false
          tags: invoice-api:latest

      # Build and validate Worker Image (passing the worker command override)
      - name: Build Worker Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: false
          tags: invoice-worker:latest
          build-args: |
            EXEC_COMMAND=npm run worker